name: Tsukiko CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-test-and-packaging:
    name: Windows Test & Packaging
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements/base.txt
          pip install -r requirements/ui.txt
          pip install -e ".[dev]"

      - name: Run complete pytest suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v

      - name: Verify real Windows Firewall policy inspection (read-only)
        shell: powershell
        run: |
          python scripts/verify_windows_firewall_inspection.py

      - name: Build wheel distribution
        run: |
          pip wheel --no-deps -w dist .

      - name: Verify installed CLI outside repository
        shell: powershell
        run: |
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          python -m pip install $wheel
          Set-Location $env:TEMP
          tsukiko --check-hardware

  linux-integration-and-packaging:
    name: Linux Integration & Native sendmsg
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system GUI libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements/base.txt
          pip install -r requirements/ui.txt
          pip install -e ".[dev]"

      - name: Run complete pytest suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v

      - name: Build wheel distribution
        run: |
          pip wheel --no-deps -w dist .

      - name: Verify installed CLI outside repository
        run: |
          WHEEL=$(ls dist/*.whl | head -n 1)
          python -m pip install "$WHEEL"
          cd /tmp
          tsukiko --check-hardware
